apiVersion: v1
kind: Service
metadata:
  name: spark-master
spec:
  type: ClusterIP
  ports:
    - port: 7077
      targetPort: 7077
      name: spark
    - port: 8080
      targetPort: 8080
      name: web-ui
  selector:
    app: spark-master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: quaqducc/spark-batch-computing:v1
        imagePullPolicy: IfNotPresent
        command: ["/opt/spark/bin/spark-class"]
        args: ["org.apache.spark.deploy.master.Master"]
        ports:
        - containerPort: 7077
          name: spark
        - containerPort: 8080
          name: web-ui
        env:
        - name: SPARK_MASTER_HOST
          value: "0.0.0.0"
        - name: SPARK_MASTER_PORT
          value: "7077"
        - name: SPARK_MASTER_WEBUI_PORT
          value: "8080"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-worker
spec:
  clusterIP: None
  selector:
    app: spark-worker
  ports:
    - port: 8081
      name: web-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      initContainers:
      - name: init-download-model
        image: quaqducc/spark-batch-computing:v1
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh","-lc"]
        args:
          - >
            python3 -c "from minio import Minio; import os;
            c=Minio(os.environ['MINIO_ENDPOINT'], os.environ['MINIO_ACCESS_KEY'], os.environ['MINIO_SECRET_KEY'], secure=False);
            os.makedirs('/tmp', exist_ok=True);
            c.fget_object(os.environ.get('MINIO_BUCKET_DATA','traffic-data'), 'models/yolov8_traffic_best.pt', '/tmp/yolov8_traffic_best.pt');
            print('Model downloaded to /tmp/yolov8_traffic_best.pt')"
        env:
        - name: MINIO_ENDPOINT
          value: "my-minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "bigdataproject"
        - name: MINIO_SECRET_KEY
          value: "bigdataproject"
        - name: MINIO_BUCKET_DATA
          value: "traffic-data"
        volumeMounts:
          - mountPath: /tmp
            name: temp-data
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "512Mi"
        - name: temp-data
          emptyDir: {}
      containers:
      - name: spark-worker
        image: quaqducc/spark-batch-computing:v1
        imagePullPolicy: IfNotPresent
        command: ["/opt/spark/bin/spark-class"]
        args: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
        ports:
        - containerPort: 8081
          name: web-ui
        env:
        - name: SPARK_WORKER_CORES
          value: "1"
        - name: SPARK_WORKER_MEMORY
          value: "1g"
        - name: SPARK_WORKER_WEBUI_PORT
          value: "8081"
        - name: MINIO_ENDPOINT
          value: "my-minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "bigdataproject"
        - name: MINIO_SECRET_KEY
          value: "bigdataproject"
        - name: MINIO_BUCKET
          value: "configs"
        - name: IMG_SIZE
          value: "320"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /tmp
            name: temp-data

